name: Deploy Whiskas demo to GitHub Pages

on:
  push:
    branches: ["claude/whiskas-checkers-ad-demo-7kbkkg"]
    paths:
      - "whiskas-sixty60-demo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload demo folder only
        uses: actions/upload-pages-artifact@v3
        with:
          path: "whiskas-sixty60-demo"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
