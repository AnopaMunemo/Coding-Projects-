<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixty60 × Whiskas — The 60-Minute Bowl</title>
<style>
  :root{
    /* ---- Host app (Checkers Sixty60) tokens, taken from the live site's CSS ---- */
    --sx-primary: #38a8ae;
    --sx-primary-hover: #148181;
    --sx-secondary: #f18070;
    --sx-secondary-hover: #e75f4c;
    --sx-neutral-950: #212b36;
    --sx-neutral-975: #1a222b;
    --sx-neutral-100: #ecf0f4;
    --sx-neutral-300: #c4cdd5;
    --sx-neutral-500: #637381;
    --sx-bg: #f4f6f8;
    --sx-deal-red: #e51f34;
    --sx-success: #3da960;
    --sx-radius: 15px;
    --sx-radius-full: 9999px;
    --sx-font: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;

    /* ---- Whiskas brand tokens, sampled directly off the real 900g packshot ---- */
    --wk-purple: #8E1A73;
    --wk-purple-light: #B1228E;
    --wk-purple-deep: #5C0F52;
    --wk-gold-start: #F9CE44;
    --wk-gold-end: #FADE07;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg,#e9ebee,#dfe3e8);
    font-family: var(--sx-font);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 36px 16px 60px;
    color: var(--sx-neutral-950);
  }
  button{font-family:inherit; cursor:pointer;}

  /* ===================== STAGE / PHONE FRAME ===================== */
  .stage{ position:relative; }
  .phone-frame{
    width: 400px; max-width: 92vw;
    height: 844px; max-height: 88vh;
    background: #0d1117;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 30px 70px rgba(20,20,30,.35), 0 4px 12px rgba(20,20,30,.15);
    position: relative;
  }
  .phone-notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:130px; height:24px; background:#0d1117; border-radius:0 0 16px 16px; z-index:20;
  }
  .app-viewport{
    width:100%; height:100%; overflow-y:auto; overflow-x:hidden;
    border-radius:30px; background: var(--sx-bg); position:relative;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .app-viewport::-webkit-scrollbar{ display:none; }

  .pitch-caption{
    text-align:center; margin-top:16px; color:#5a6472; font-size:12px; letter-spacing:.3px;
  }
  .pitch-caption b{ color:#2e3d4c; }

  /* ===================== HEADER ===================== */
  .sx-header{
    position: sticky; top:0; z-index:10;
    background: var(--sx-neutral-975);
    padding: 14px 14px 10px;
  }
  .sx-header-top{ display:flex; align-items:center; justify-content:space-between; }
  .sx-logo{ font-weight:800; font-size:20px; color:#fff; letter-spacing:-.3px; }
  .sx-logo span{ color: var(--sx-primary); }
  .sx-cart{
    background: var(--sx-secondary); color:#fff; border:none; border-radius:var(--sx-radius-full);
    width:34px; height:34px; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .sx-search-row{ display:flex; gap:8px; margin-top:12px; }
  .sx-search{
    flex:1; background: var(--sx-neutral-100); border:none; border-radius:var(--sx-radius-full);
    padding:9px 14px; font-size:13px; color:var(--sx-neutral-500);
  }
  .sx-signin{
    background:transparent; border:1px solid rgba(255,255,255,.3); color:#fff;
    border-radius:var(--sx-radius-full); padding:8px 14px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .sx-delivery-pills{ display:flex; gap:8px; margin-top:10px; }
  .pill{
    display:inline-flex; align-items:center; gap:4px; border-radius:var(--sx-radius-full);
    font-size:11px; font-weight:700; padding:4px 10px; border:1.5px solid transparent;
  }
  .pill-teal{ color: var(--sx-primary); border-color: var(--sx-primary); background: rgba(56,168,174,.08); }
  .pill-green{ color: var(--sx-success); border-color: var(--sx-success); background: rgba(61,169,96,.08); }

  /* ===================== QUICK SHOPS ===================== */
  .quick-shops{
    display:flex; gap:18px; overflow-x:auto; padding: 16px 14px 6px; scroll-snap-type:x proximity;
  }
  .qs-item{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto; scroll-snap-align:start; }
  .qs-icon{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#fff; box-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .qs-label{ font-size:10px; font-weight:700; color:var(--sx-neutral-950); text-align:center; width:62px; line-height:1.2; }
  .dots-row{ display:flex; justify-content:center; gap:5px; padding:2px 0 10px; }
  .dots-row span{ width:5px; height:5px; border-radius:50%; background:var(--sx-neutral-300); }
  .dots-row span.on{ background:var(--sx-neutral-500); }

  /* ===================== PROMO BANNERS ===================== */
  .promo-banner{
    margin: 6px 14px 18px; border-radius: var(--sx-radius); padding: 22px 18px;
    background: linear-gradient(120deg,var(--sx-primary),var(--sx-primary-hover));
    color:#fff; display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow: 0 6px 16px rgba(56,168,174,.25);
  }
  .promo-banner.alt{ background: linear-gradient(120deg,#175656,var(--sx-neutral-975)); }
  .promo-headline{ font-weight:800; font-size:19px; line-height:1.15; margin:0; max-width:180px; }
  .promo-cta{
    background: var(--sx-secondary); color:#fff; border:none; border-radius:var(--sx-radius-full);
    padding:9px 18px; font-weight:800; font-size:13px; box-shadow:0 4px 10px rgba(241,128,112,.4); white-space:nowrap;
  }

  /* ===================== PRODUCT RAILS ===================== */
  .rail{ padding: 4px 0 8px; }
  .rail-head{ display:flex; align-items:baseline; justify-content:space-between; padding:0 14px 10px; }
  .rail-title{ font-size:14px; font-weight:800; letter-spacing:.2px; margin:0; text-transform:uppercase; }
  .rail-viewall{ font-size:12px; font-weight:700; color:var(--sx-primary); }
  .rail-scroll{ display:flex; gap:10px; overflow-x:auto; padding: 2px 14px 10px; scroll-snap-type:x proximity; }
  .product-card{
    flex:0 0 132px; scroll-snap-align:start; background:#fff; border-radius:var(--sx-radius);
    box-shadow: 0 1px 3px rgba(33,43,54,.08); overflow:hidden; display:flex; flex-direction:column;
  }
  .card-media{ position:relative; height:96px; display:flex; align-items:center; justify-content:center;
    font-size:40px; background:#fafbfc; }
  .add-btn{
    position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
    background: var(--sx-primary); color:#fff; border:none; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.15);
    transition: transform .15s ease;
  }
  .add-btn:active{ transform: scale(.88); }
  .badge{ position:absolute; top:6px; left:6px; font-size:9px; font-weight:800; border-radius:5px; padding:2px 6px; color:#fff; }
  .badge-save{ background: var(--sx-deal-red); }
  .badge-new{ background: var(--sx-success); }
  .badge-online{ background:#000; }
  .badge-age{ background:#fff; color:#000; border:1.5px solid var(--sx-deal-red); border-radius:50%;
    width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:9px; padding:0; top:6px; right:6px; left:auto; }
  .card-body{ padding:9px 9px 10px; display:flex; flex-direction:column; gap:2px; }
  .card-price{ font-weight:800; font-size:14px; margin:0; color:var(--sx-neutral-950); }
  .card-price.on-promo{ color:var(--sx-deal-red); }
  .card-price-strike{ font-size:10px; font-weight:600; color:var(--sx-neutral-500); text-decoration:line-through; margin-left:5px; }
  .card-perkg{ font-size:9px; color:var(--sx-neutral-500); margin:0; }
  .card-name{ font-size:11px; font-weight:600; margin:2px 0 6px; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:28px; }
  .card-pill{ align-self:flex-start; font-size:9px; padding:2px 8px; }

  /* ===================== AD SLOT / WHISKAS CARD ===================== */
  .ad-slot{
    max-height:0; opacity:0; overflow:hidden; margin:0 14px;
    transition: max-height .55s cubic-bezier(.2,.8,.2,1), opacity .45s ease, margin .55s ease;
  }
  .ad-slot.ad-slot--active{ max-height:260px; opacity:1; margin:6px 14px 20px; }
  .ad-slot.ad-slot--dismissed{ max-height:0 !important; opacity:0 !important; margin:0 14px !important; }

  .whiskas-ad-card{
    position:relative; border-radius: var(--sx-radius); padding:16px;
    background: linear-gradient(135deg, var(--wk-purple) 0%, var(--wk-purple-light) 100%);
    box-shadow: 0 10px 26px rgba(142,26,115,.4);
    color:#fff; border:none; width:100%; text-align:left;
    transform: translateY(6px);
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .ad-slot--active .whiskas-ad-card{ transform: translateY(0); }
  .whiskas-ad-card:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  .ad-sponsored{ font-size:9px; letter-spacing:.6px; text-transform:uppercase; opacity:.75; font-weight:700; margin:0 0 6px; }
  .ad-close{
    position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%;
    background: rgba(255,255,255,.2); color:#fff; border:none; font-size:13px; line-height:1;
    display:flex; align-items:center; justify-content:center; z-index:3;
  }
  .ad-close:hover{ background: rgba(255,255,255,.32); }
  .ad-content{ display:flex; align-items:center; gap:12px; }
  .ad-copy{ flex:1; min-width:0; }
  .ad-headline{ font-weight:800; font-size:17px; line-height:1.22; margin:0 0 6px; }
  .ad-subline{ font-size:12.5px; opacity:.92; margin:0 0 13px; line-height:1.35; }
  .ad-cta{
    /* Deliberate brand-rule exception: Sixty60 TEAL is used here — and ONLY here in the ad —
       so the button reads as native app chrome while the rest of the unit stays Whiskas purple. */
    background: var(--sx-primary); color:#fff; border:none; border-radius:var(--sx-radius-full);
    padding:9px 18px; font-weight:800; font-size:12.5px; box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  .ad-cta:hover{ background: var(--sx-primary-hover); }
  .ad-media{ position:relative; flex:0 0 92px; display:flex; align-items:center; justify-content:center; }
  .ad-product-img{ width:88px; height:88px; object-fit:contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
  .ad-gold-band{
    position:absolute; top:-6px; left:-10px; background: linear-gradient(90deg,var(--wk-gold-start),var(--wk-gold-end));
    color:#5b3d00; font-weight:800; font-size:8.5px; padding:2px 7px; border-radius:5px; transform:rotate(-6deg);
    box-shadow:0 2px 4px rgba(0,0,0,.2); white-space:nowrap;
  }

  /* ===================== BOTTOM SHEET (modal) ===================== */
  .sheet-overlay{
    position:absolute; inset:0; z-index:30; background: rgba(15,10,20,.5);
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition: opacity .25s ease;
    border-radius:30px;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .bottom-sheet{
    width:100%; max-height:92%; overflow-y:auto; background:#fff; border-radius:22px 22px 0 0;
    padding:10px 20px 26px; transform:translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .sheet-overlay.open .bottom-sheet{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:99px; background:var(--sx-neutral-300); margin:8px auto 14px; }
  .sheet-close{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
    background: var(--sx-neutral-100); border:none; font-size:14px; z-index:2;
  }
  .sheet-stage[hidden]{ display:none; }

  .sheet-product-row{ display:flex; gap:14px; align-items:center; }
  .sheet-product-img{ width:96px; height:96px; object-fit:contain; filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); flex:0 0 auto; }
  .sheet-title{ font-size:15px; font-weight:800; margin:0 0 4px; line-height:1.25; }
  .sheet-size{ font-size:12px; color:var(--sx-neutral-500); margin:0 0 6px; font-weight:700; }
  .sheet-price{ font-size:19px; font-weight:800; color:var(--sx-neutral-950); margin:0; }
  .sheet-personal-box{
    margin-top:16px; background: linear-gradient(135deg, rgba(142,26,115,.08), rgba(177,34,142,.05));
    border: 1px solid rgba(142,26,115,.18); border-radius: var(--sx-radius); padding:12px 14px;
  }
  .sheet-personal-eyebrow{ font-size:9.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--wk-purple); margin:0 0 4px; }
  .sheet-personal-line{ font-size:13.5px; font-weight:600; margin:0; color:var(--sx-neutral-950); line-height:1.4; }
  .sheet-cta{
    width:100%; margin-top:18px; background: var(--sx-primary); color:#fff; border:none;
    border-radius: var(--sx-radius-full); padding:13px; font-weight:800; font-size:14.5px;
    box-shadow: 0 6px 14px rgba(56,168,174,.35);
  }
  .sheet-cta:hover{ background: var(--sx-primary-hover); }
  .sheet-cta:disabled{ opacity:.6; }

  /* ===================== BOWL SEQUENCE ===================== */
  .bowl-stage{ text-align:center; padding-top:6px; }
  .bowl-status-label{ font-size:16px; font-weight:800; margin:0 0 2px; color:var(--sx-neutral-950); min-height:22px; }
  .bowl-visual{ position:relative; width:180px; height:180px; margin:14px auto; display:flex; align-items:center; justify-content:center; }
  .progress-ring{ position:absolute; top:50%; left:50%; transform: translate(-50%,-50%); }
  .ring-fill{ transition: stroke-dashoffset linear; }
  .bowl-svg{ position:relative; z-index:2; }
  .countdown-label{
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    font-size:13px; font-weight:800; color: var(--wk-purple); background:#fff; padding:2px 10px;
    border-radius:99px; box-shadow:0 2px 6px rgba(0,0,0,.12); letter-spacing:.5px;
  }
  #bowlFillRect{ transition: y 0s linear, height 0s linear; }
  .bowl-stage.stage-filling #bowlFillRect,
  .bowl-stage.stage-full #bowlFillRect{ y:92px; height:78px; }
  .bowl-caption{ font-size:13px; color:var(--sx-neutral-500); margin: 4px 0 0; min-height:18px; }
  .confetti-layer{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  @keyframes confetti-fall{
    0%{ transform: translateY(-20px) rotate(0deg); opacity:1; }
    100%{ transform: translateY(170px) rotate(360deg); opacity:0; }
  }
  .confetti-piece{ position:absolute; top:0; width:6px; height:6px; border-radius:1px; animation: confetti-fall 900ms ease-in forwards; }

  /* ===================== TOAST ===================== */
  .toast{
    position:absolute; left:50%; bottom:18px; transform: translateX(-50%) translateY(10px);
    background: var(--sx-neutral-975); color:#fff; font-size:12.5px; font-weight:700;
    padding:9px 16px; border-radius: var(--sx-radius-full); opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease; z-index:40; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ===================== PERSONA SWITCHER ===================== */
  .persona-switcher{ position:absolute; top:0; right:-56px; }
  .persona-gear{
    width:42px; height:42px; border-radius:50%; background:#fff; border:1px solid var(--sx-neutral-300);
    box-shadow:0 4px 10px rgba(0,0,0,.12); font-size:18px; display:flex; align-items:center; justify-content:center;
  }
  .persona-popover{
    position:absolute; top:50px; right:0; width:216px; background:#fff; border-radius:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.18); padding:10px; z-index:50;
  }
  .persona-popover[hidden]{ display:none; }
  .persona-popover-title{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--sx-neutral-500); margin:2px 6px 8px; }
  .persona-option{
    display:block; width:100%; text-align:left; background:none; border:none; border-radius:10px;
    padding:8px 9px; font-size:13px; font-weight:700; color:var(--sx-neutral-950);
  }
  .persona-option:hover{ background: var(--sx-neutral-100); }
  .persona-option.active{ background: rgba(142,26,115,.1); color: var(--wk-purple); }
  .persona-option small{ display:block; font-weight:600; color:var(--sx-neutral-500); font-size:11px; }
  .persona-option.active small{ color: var(--wk-purple-light); }

  @media (max-width: 760px){
    .persona-switcher{ top:-56px; right:0; }
    .persona-popover{ top:0; right:0; }
  }

  /* On an actual phone, the fake-bezel "device in a page" layout leaves the
     outer page taller than the visible viewport, so a real touch-scroll
     gesture drags the OUTER page instead of the inner feed — the ad's
     scroll trigger then never fires because #appViewport.scrollTop never
     moves. Below this breakpoint the app fills the real viewport edge to
     edge and the outer page can't scroll at all, so every touch gesture is
     unambiguously the feed's own scroll. */
  @media (max-width: 600px){
    html{
      height:100vh; height:100dvh;
      overflow:hidden;
    }
    body{
      height:100vh; height:100dvh;
      overflow:hidden; padding:0;
      align-items:stretch; justify-content:stretch;
    }
    .stage{ width:100%; height:100%; }
    .phone-frame{
      width:100%; max-width:100%; height:100%; max-height:100%;
      border-radius:0; padding:0; box-shadow:none;
    }
    .phone-notch{ display:none; }
    .app-viewport{ border-radius:0; }
    .pitch-caption{ display:none; }
    .persona-switcher{ position:fixed; top:10px; right:10px; z-index:60; }
  }

  @media (prefers-reduced-motion: reduce){
    .ad-slot, .whiskas-ad-card, #bowlFillRect, .ring-fill, .bottom-sheet, .confetti-piece, .add-btn{
      transition:none !important; animation:none !important;
    }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="persona-switcher" id="personaSwitcher">
      <button class="persona-gear" id="personaGearBtn" aria-haspopup="true" aria-expanded="false" aria-label="Switch demo persona">⚙️</button>
      <div class="persona-popover" id="personaPopover" hidden></div>
    </div>

    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="app-viewport" id="appViewport">

        <header class="sx-header">
          <div class="sx-header-top">
            <span class="sx-logo">Sixty6<span>O</span></span>
            <button class="sx-cart" aria-label="Cart">🛒</button>
          </div>
          <div class="sx-search-row">
            <input class="sx-search" placeholder="Search Sixty60" disabled>
            <button class="sx-signin">Sign in</button>
          </div>
          <div class="sx-delivery-pills">
            <span class="pill pill-teal">🚐 60 MIN</span>
            <span class="pill pill-green">🕒 11-12 PM</span>
          </div>
        </header>

        <div class="quick-shops" id="quickShops"></div>
        <div class="dots-row"><span class="on"></span><span></span><span></span></div>

        <div class="promo-banner">
          <p class="promo-headline">Big Weekend<br>Savings</p>
          <button class="promo-cta">Shop now</button>
        </div>

        <div id="railsContainer"></div>

        <div class="promo-banner alt">
          <p class="promo-headline">Payday<br>Deals</p>
          <button class="promo-cta">Shop now</button>
        </div>

        <div id="railsContainer2"></div>

        <div class="toast" id="toast"></div>
      </div>

      <!-- Bottom sheet: quick-add / product detail + 60-Minute Bowl sequence -->
      <div class="sheet-overlay" id="sheetOverlay">
        <div class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
          <button class="sheet-close" id="sheetCloseBtn" aria-label="Close">✕</button>
          <div class="sheet-handle"></div>

          <div class="sheet-stage" id="stageDetail">
            <div class="sheet-product-row">
              <img class="sheet-product-img" id="sheetProductImg" src="" alt="">
              <div>
                <h3 class="sheet-title" id="sheetTitle" tabindex="-1"></h3>
                <p class="sheet-size" id="sheetSize"></p>
                <p class="sheet-price" id="sheetPrice"></p>
              </div>
            </div>
            <div class="sheet-personal-box">
              <p class="sheet-personal-eyebrow">For your household</p>
              <p class="sheet-personal-line" id="sheetPersonalLine"></p>
            </div>
            <button class="sheet-cta" id="sheetCta"></button>
          </div>

          <div class="sheet-stage bowl-stage" id="stageBowl" hidden>
            <p class="bowl-status-label" id="bowlStatusLabel">Order confirmed</p>
            <div class="bowl-visual">
              <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
              <svg class="progress-ring" viewBox="0 0 140 140" width="150" height="150" id="progressRing" aria-hidden="true">
                <circle cx="70" cy="70" r="60" fill="none" stroke="#eee" stroke-width="7"></circle>
                <circle id="ringFill" cx="70" cy="70" r="60" fill="none" stroke="var(--sx-primary)" stroke-width="7"
                        stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377"
                        transform="rotate(-90 70 70)"></circle>
              </svg>
              <svg class="bowl-svg" viewBox="0 0 200 200" width="120" height="120" aria-hidden="true">
                <defs>
                  <clipPath id="bowlClip">
                    <path d="M28,88 Q100,144 172,88 L172,152 Q100,180 28,152 Z"></path>
                  </clipPath>

        <div class="card-media">
          ${badgeHtml}
          <button class="add-btn" aria-label="Add ${p.name}" onclick="window.__whiskasDemo.onAddTap(this)">+</button>
          <span>${p.emoji}</span>
        </div>
        <div class="card-body">
          ${priceHtml}
          <p class="card-perkg">${p.perKg || '&nbsp;'}</p>
          <p class="card-name">${p.name}</p>
          <span class="pill ${pillClass} card-pill">${pillIcon} ${p.delivery}</span>
        </div>
      </article>`;
  }

  function railHtml(rail){
    return `
      <section class="rail">
        <div class="rail-head">
          <h2 class="rail-title">${rail.title}</h2>
          <a class="rail-viewall" href="#">View All</a>
        </div>
        <div class="rail-scroll">
          ${rail.products.map(productCardHtml).join('')}
        </div>
      </section>`;
  }

  function renderRails(){
    $('railsContainer').innerHTML = MOCK_RAILS_A.map(railHtml).join('') + adSlotHtml();
    $('railsContainer2').innerHTML = MOCK_RAILS_B.map(railHtml).join('');
  }

  function adSlotHtml(){
    return `<div class="ad-slot" id="adSlot" aria-live="polite">
      <article class="whiskas-ad-card" id="whiskasAdCard" role="button" tabindex="0"
               aria-label="Open Whiskas reorder for ${CAMPAIGN_CONFIG.brand.product.shortName}">
        <button class="ad-close" id="adCloseBtn" aria-label="Dismiss Whiskas ad">✕</button>
        <p class="ad-sponsored">Sponsored · ${CAMPAIGN_CONFIG.brand.name}</p>
        <div class="ad-content">
          <div class="ad-copy">
            <p class="ad-headline" id="adHeadline"></p>
            <p class="ad-subline" id="adSubline"></p>
            <button class="ad-cta" id="adCtaBtn" tabindex="-1">${CAMPAIGN_CONFIG.campaign.adCtaLabel}</button>
          </div>
          <div class="ad-media">
            <span class="ad-gold-band">NEW PACK</span>
            <img class="ad-product-img" src="${CAMPAIGN_CONFIG.brand.product.imageDataUri}" alt="${CAMPAIGN_CONFIG.brand.product.name}">
          </div>
        </div>
      </article>
    </div>`;
  }

  function renderAdCopy(){
    const persona = getActivePersona();
    $('adHeadline').textContent = fillTemplate(CAMPAIGN_CONFIG.campaign.adHeadlineTemplate, persona);
    $('adSubline').textContent = fillTemplate(CAMPAIGN_CONFIG.campaign.adBodyTemplate, persona);
  }

  /* ===================== SCROLL TRIGGER / DISMISS ===================== */

  function hydrateSessionState(){
    /* sessionStorage can throw (not just return null) when a browser denies
       storage access to this sandboxed iframe — e.g. iOS Safari's cross-site
       tracking prevention on an embedded Artifact. Left unguarded, that throw
       aborts init() before wireEvents() runs, so the ad's scroll listener
       never gets attached and the ad silently never appears. */
    try {
      state.adDismissed = sessionStorage.getItem(CAMPAIGN_CONFIG.scrollTrigger.sessionStorageKey) === '1';
    } catch (err) {
      state.adDismissed = false;
    }
    if (state.adDismissed){
      const slot = $('adSlot');
      if (slot) slot.classList.add('ad-slot--dismissed');
    }
  }

  function onScroll(){
    if (state.adDismissed || state.adInjected) return;
    if (state.rafPending) return;
    state.rafPending = true;
    requestAnimationFrame(() => {
      state.rafPending = false;
      if (appViewport().scrollTop > CAMPAIGN_CONFIG.scrollTrigger.thresholdPx){
        showAd();
      }
    });
  }

  function showAd(){
    state.adInjected = true;
    $('adSlot').classList.add('ad-slot--active');
    appViewport().removeEventListener('scroll', onScroll);
  }

  function dismissAd(evt){
    evt.stopPropagation();
    $('adSlot').classList.add('ad-slot--dismissed');
    state.adDismissed = true;
    try {
      sessionStorage.setItem(CAMPAIGN_CONFIG.scrollTrigger.sessionStorageKey, '1');
    } catch (err) {
      /* Storage blocked — dismiss still works for this page view via
         in-memory state.adDismissed, it just won't persist across a reload. */
    }
  }

  /* ===================== BOTTOM SHEET ===================== */

  function openModal(){
    state.modalOpen = true;
    state.lastFocusedElement = document.activeElement;

    const persona = getActivePersona();
    const product = CAMPAIGN_CONFIG.brand.product;

    $('sheetProductImg').src = product.imageDataUri;
    $('sheetProductImg').alt = product.name;
    $('sheetTitle').textContent = product.name;
    $('sheetSize').textContent = product.size;
    $('sheetPrice').textContent = product.price;
    $('sheetPersonalLine').textContent = fillTemplate(CAMPAIGN_CONFIG.campaign.personalizedGreetingTemplate, persona);
    $('sheetCta').textContent = CAMPAIGN_CONFIG.campaign.sheetCtaLabel;
    $('sheetCta').disabled = false;

    $('stageBowl').hidden = true;
    $('stageDetail').hidden = false;
    $('stageBowl').className = 'sheet-stage bowl-stage';
    $('bowlFillRect').style.transitionDuration = '0s';
    $('ringFill').style.transitionDuration = '0s';
    $('ringFill').style.strokeDashoffset = '377';
    $('countdownLabel').textContent = CAMPAIGN_CONFIG.campaign.countdown.startLabel;
    $('confettiLayer').innerHTML = '';

    $('sheetOverlay').style.display = 'flex';
    requestAnimationFrame(() => $('sheetOverlay').classList.add('open'));
    document.addEventListener('keydown', onSheetKeydown);
    $('sheetTitle').focus({ preventScroll:true });
  }

  function closeModal(){
    state.modalOpen = false;
    $('sheetOverlay').classList.remove('open');
    document.removeEventListener('keydown', onSheetKeydown);
    setTimeout(() => { $('sheetOverlay').style.display = 'none'; }, 300);
    if (state.lastFocusedElement) state.lastFocusedElement.focus({ preventScroll:true });
  }

  function onSheetKeydown(e){
    if (e.key === 'Escape') closeModal();
  }

  /* ===================== 60-MINUTE BOWL SEQUENCE ===================== */

  function setBowlStatus(label, caption){
    $('bowlStatusLabel').textContent = label;
    $('bowlCaption').textContent = caption;
  }

  function animateRing(duration){
    const ring = $('ringFill');
    ring.style.transitionDuration = duration + 'ms';
    requestAnimationFrame(() => { ring.style.strokeDashoffset = '0'; });
  }

  function animateCountdownText(duration){
    const label = $('countdownLabel');
    const totalSeconds = 60 * 60;
    const start = performance.now();
    function tick(now){
      const pct = Math.min((now - start) / duration, 1);
      const remaining = Math.round(totalSeconds * (1 - pct));
      const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
      const ss = String(remaining % 60).padStart(2, '0');
      label.textContent = mm + ':' + ss;
      if (pct < 1) requestAnimationFrame(tick);
      else label.textContent = CAMPAIGN_CONFIG.campaign.countdown.endLabel;
    }
    requestAnimationFrame(tick);
  }

  function fireConfetti(){
    const layer = $('confettiLayer');
    const colors = ['#8E1A73', '#B1228E', '#F9CE44', '#38a8ae'];
    for (let i = 0; i < 22; i++){
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = (Math.random() * 200) + 'ms';
      layer.appendChild(piece);
    }
    setTimeout(() => { layer.innerHTML = ''; }, 1500);
  }

  function startBowlSequence(){
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const persona = getActivePersona();
    const D = CAMPAIGN_CONFIG.campaign.countdown.durationMs;

    $('sheetCta').disabled = true;
    $('stageDetail').hidden = true;
    const bowlStage = $('stageBowl');
    bowlStage.hidden = false;
    bowlStage.className = 'sheet-stage bowl-stage';
    setBowlStatus('Order confirmed', 'Confirming your order…');

    if (reduceMotion){
      $('bowlFillRect').style.transitionDuration = '0ms';
      $('countdownLabel').textContent = CAMPAIGN_CONFIG.campaign.countdown.startLabel;
      setTimeout(() => {
        setBowlStatus('On its way', 'Your 60-minute bowl is being prepared…');
        $('countdownLabel').textContent = CAMPAIGN_CONFIG.campaign.countdown.endLabel;
        bowlStage.classList.add('stage-full');
      }, 500);
      setTimeout(() => {
        setBowlStatus('Bowl is full!', fillTemplate(CAMPAIGN_CONFIG.campaign.successCaptionTemplate, persona));
      }, 1400);
      return;
    }

    setTimeout(() => {
      bowlStage.classList.add('stage-filling');
      setBowlStatus('On its way', 'Your 60-minute bowl is being prepared…');
      animateRing(D);
      animateCountdownText(D);
      $('bowlFillRect').style.transitionDuration = D + 'ms';
      bowlStage.classList.add('stage-full');
    }, 600);

    setTimeout(() => {
      setBowlStatus('Bowl is full!', fillTemplate(CAMPAIGN_CONFIG.campaign.successCaptionTemplate, persona));
      fireConfetti();
      bowlStage.classList.add('stage-done');
    }, 600 + D + 250);
  }

  /* ===================== TOAST (native +Add feedback) ===================== */

  let toastTimer = null;
  function showToast(text){
    const toast = $('toast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
  }

  /* ===================== PERSONA SWITCHER ===================== */

  function renderPersonaOptions(){
    const container = $('personaPopover');
    const list = CAMPAIGN_CONFIG.personas.map(p => `
      <button class="persona-option ${p.id === state.activePersonaId ? 'active' : ''}" data-persona-id="${p.id}">
        ${p.ownerName}<small>${p.catName}'s owner</small>
      </button>`).join('');
    container.innerHTML = `<p class="persona-popover-title">Demo shopper</p>${list}`;
  }

  function rerenderPersonalizedStrings(){
    renderAdCopy();
    if (state.modalOpen){
      $('sheetPersonalLine').textContent = fillTemplate(CAMPAIGN_CONFIG.campaign.personalizedGreetingTemplate, getActivePersona());
    }
  }

  function togglePersonaPopover(open){
    const popover = $('personaPopover');
    const gear = $('personaGearBtn');
    const willOpen = open !== undefined ? open : popover.hidden;
    popover.hidden = !willOpen;
    gear.setAttribute('aria-expanded', String(willOpen));
  }

  /* ===================== EVENT WIRING ===================== */

  function wireEvents(){
    appViewport().addEventListener('scroll', onScroll, { passive: true });

    document.body.addEventListener('click', (e) => {
      const closeBtn = e.target.closest('#adCloseBtn');
      if (closeBtn){ dismissAd(e); return; }

      const adCard = e.target.closest('#whiskasAdCard');
      if (adCard){ openModal(); return; }
    });

    document.addEventListener('keydown', (e) => {
      const adCard = document.activeElement;
      if (adCard && adCard.id === 'whiskasAdCard' && (e.key === 'Enter' || e.key === ' ')){
        e.preventDefault();
        openModal();
      }
    });

    $('sheetCloseBtn').addEventListener('click', closeModal);
    $('sheetOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    $('sheetCta').addEventListener('click', startBowlSequence);

    $('personaGearBtn').addEventListener('click', () => togglePersonaPopover());
    document.addEventListener('click', (e) => {
      if (!$('personaSwitcher').contains(e.target)) togglePersonaPopover(false);
    });
    $('personaPopover').addEventListener('click', (e) => {
      const btn = e.target.closest('.persona-option');
      if (!btn) return;
      state.activePersonaId = btn.dataset.personaId;
      renderPersonaOptions();
      rerenderPersonalizedStrings();
    });
  }

  window.__whiskasDemo = {
    onAddTap(btn){
      btn.style.transform = 'scale(.8)';
      setTimeout(() => { btn.style.transform = ''; }, 140);
      showToast('Added to basket');
    }
  };

  /* ===================== INIT ===================== */

  function init(){
    renderQuickShops();
    renderRails();
    renderAdCopy();
    renderPersonaOptions();
    hydrateSessionState();
    wireEvents();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
